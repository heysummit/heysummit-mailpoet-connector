name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["7.4", "8.1", "8.3"]

    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      - name: Lint PHP
        run: find . -path './node_modules' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run connector contract tests
        run: php tests/connector-test.php
      - name: Build production plugin archive
        run: npm run build:zip
